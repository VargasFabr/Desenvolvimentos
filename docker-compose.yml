version: '3.8'

services:
  airflow-standalone:
    image: apache/airflow:3.1.3
    container_name: airflow3-standalone
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=America/Sao_Paulo
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=true
      - AIRFLOW__API__EXPOSE_CONFIG=true
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=true
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - AIRFLOW__WEBSERVER__SECRET_KEY=mysecretkey
      - _AIRFLOW_WWW_USER_CREATE=true
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - _AIRFLOW_WWW_USER_FIRSTNAME=Admin
      - _AIRFLOW_WWW_USER_LASTNAME=User
      - _AIRFLOW_WWW_USER_EMAIL=admin@admin.com
      - _AIRFLOW_WWW_USER_ROLE=Admin
    ports:
      - "8081:8080"
    volumes:
      # Volumes relativos ao workspace (funcionam em Linux)
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ./requirements.txt:/opt/airflow/requirements.txt
      
      # IMPORTANTE: Ajuste estes caminhos para caminhos Linux válidos
      # Opção 1: Use caminhos relativos (recomendado)
      - ./ProjetosVS:/opt/airflow/ProjetosVS
      
      # Opção 2: Use caminhos absolutos Linux (exemplo)
      # - /home/seu-usuario/Projetos/logsOtto:/opt/airflow/logsOtto
      # - /home/seu-usuario/Projetos/VS_Code:/opt/airflow/ProjetosVS
      
      # Volume nomeado para persistência
      - airflow-db:/opt/airflow/airflow-db
    command: standalone
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "[ -f /opt/airflow/airflow-webserver.pid ]"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  airflow-db:
