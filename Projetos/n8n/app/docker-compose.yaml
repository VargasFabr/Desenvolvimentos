# ============================================================
# Stack "app": n8n + Chatwoot + Redis + python-img
# Postgres ao vivo: PostgreSQL Windows (postgresql-x64-17) em host.docker.internal:5432
# Borda da empresa (200.215.210.68) -> VM 192.168.210.50:5678 (n8n) e :3000 (chatwoot)
# Volumes Docker: melnick_app_* (renomeados de airflow3_* legado da stack unificada).
# Subir:   docker compose up -d
# ============================================================
# Segredos: hardlink ./.env → Desenvolvimentos/.env (gitignored)
services:
  # n8n (Postgres Windows; db: n8n)
  n8n:
    image: n8nio/n8n:2.22.5
    container_name: n8n
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_PROTOCOL=https
      - N8N_PROXY_HOPS=1
      - N8N_SKIP_AUTH_ON_OAUTH_CALLBACK=true
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      # Temporario: false p/ acesso via http://localhost durante a migracao.
      # Trocar para true quando o acesso for so via https://backoffice01.melnick.com.br
      - N8N_SECURE_COOKIE=false
      - NODE_ENV=production
      - N8N_WORKFLOW_HISTORY_ENABLED=true
      - N8N_WORKFLOW_HISTORY_DAYS_TO_KEEP=30
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=host.docker.internal
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=${CHATWOOT_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${CHATWOOT_DB_PASSWORD}
    ports:
      - "5678:5678"
    volumes:
      - ../data/n8n:/home/node/.n8n

  # Redis (Chatwoot usa DB 1)
  redis:
    image: redis:7
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  chatwoot:
    image: ${CHATWOOT_IMAGE:-chatwoot/chatwoot:v4.11.1}
    container_name: chatwoot
    restart: unless-stopped
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_USERNAME=${CHATWOOT_DB_USER}
      - POSTGRES_PASSWORD=${CHATWOOT_DB_PASSWORD}
      - POSTGRES_DATABASE=${CHATWOOT_POSTGRES_DB:-chatwoot_production}
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY_BASE}
      - FRONTEND_URL=${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
      # Atras do proxy HTTPS: NAO usar FORCE_SSL (causa loop). A TI deve enviar X-Forwarded-Proto: https
      - ENABLE_ACCOUNT_SIGNUP=${CHATWOOT_ENABLE_ACCOUNT_SIGNUP:-true}
      - MAILER_SENDER_EMAIL=${CHATWOOT_MAILER_SENDER_EMAIL:-Chatwoot}
      - SMTP_ADDRESS=${CHATWOOT_SMTP_ADDRESS:-}
      - SMTP_PORT=${CHATWOOT_SMTP_PORT:-1025}
      - SMTP_DOMAIN=${CHATWOOT_SMTP_DOMAIN:-localhost}
      - ACTIVE_STORAGE_SERVICE=local
      - RAILS_LOG_TO_STDOUT=true
      - LOG_LEVEL=info
      - WHATSAPP_APP_ID=${WHATSAPP_APP_ID}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_CONFIGURATION_ID=${WHATSAPP_CONFIGURATION_ID}
    volumes:
      - chatwoot_storage:/app/storage
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]

  chatwoot_sidekiq:
    image: ${CHATWOOT_IMAGE:-chatwoot/chatwoot:v4.11.1}
    container_name: chatwoot_sidekiq
    restart: unless-stopped
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - RAILS_ENV=production
      - INSTALLATION_ENV=docker
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_USERNAME=${CHATWOOT_DB_USER}
      - POSTGRES_PASSWORD=${CHATWOOT_DB_PASSWORD}
      - POSTGRES_DATABASE=${CHATWOOT_POSTGRES_DB:-chatwoot_production}
      - REDIS_URL=redis://redis:6379/1
      - SECRET_KEY_BASE=${CHATWOOT_SECRET_KEY_BASE}
      - FRONTEND_URL=${CHATWOOT_FRONTEND_URL:-http://localhost:3000}
      # Atras do proxy HTTPS: NAO usar FORCE_SSL (causa loop). A TI deve enviar X-Forwarded-Proto: https
      - ENABLE_ACCOUNT_SIGNUP=${CHATWOOT_ENABLE_ACCOUNT_SIGNUP:-true}
      - MAILER_SENDER_EMAIL=${CHATWOOT_MAILER_SENDER_EMAIL:-Chatwoot}
      - SMTP_ADDRESS=${CHATWOOT_SMTP_ADDRESS:-}
      - SMTP_PORT=${CHATWOOT_SMTP_PORT:-1025}
      - SMTP_DOMAIN=${CHATWOOT_SMTP_DOMAIN:-localhost}
      - ACTIVE_STORAGE_SERVICE=local
      - RAILS_LOG_TO_STDOUT=true
      - LOG_LEVEL=info
      - WHATSAPP_APP_ID=${WHATSAPP_APP_ID}
      - WHATSAPP_APP_SECRET=${WHATSAPP_APP_SECRET}
      - WHATSAPP_CONFIGURATION_ID=${WHATSAPP_CONFIGURATION_ID}
    volumes:
      - chatwoot_storage:/app/storage
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

  python-img:
    build:
      context: ../python
      dockerfile: Dockerfile
    image: python-img:latest
    container_name: python-img
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - OTTO_ADMIN_EMAIL=${OTTO_ADMIN_EMAIL}
      - OTTO_ADMIN_PASSWORD=${OTTO_ADMIN_PASSWORD}
      - OTTO_DB_HOST=${OTTO_DB_HOST}
      - OTTO_DB_PORT=${OTTO_DB_PORT}
      - OTTO_DB_NAME=${OTTO_DB_NAME}
      - OTTO_DB_USER=${OTTO_DB_USER}
      - OTTO_DB_PASSWORD=${OTTO_DB_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  chatwoot_storage:
    external: true
    name: melnick_app_chatwoot_storage
  redis-data:
    external: true
    name: melnick_app_redis_data
